<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كل عام وأنتِ زوجتي الحبيبة فرح ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      /* خلفية سماء ليلية عميقة وأنيقة */
      background: linear-gradient(to bottom, #020005, #0b091a, #1a102f);
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    /* سماء النجوم */
    #sky {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .star {
      position: absolute;
      background-color: #fff;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: twinkle linear infinite;
    }

    .star:hover {
      transform: scale(2.2);
      box-shadow: 0 0 15px rgba(255, 215, 0, 1);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* النجوم الخاصة */
    .special-star {
      position: absolute;
      border-radius: 50%;
      cursor: pointer;
      z-index: 5;
      animation: pulseStar 2s infinite;
    }

    .letter-star {
      width: 18px;
      height: 18px;
      background-color: #ffd700;
      box-shadow: 0 0 30px #ffd700, 0 0 60px #ffd700;
      top: 30%;
      left: 35%;
    }

    .poem-star {
      width: 18px;
      height: 18px;
      background-color: #ff758c;
      box-shadow: 0 0 30px #ff758c, 0 0 60px #ff758c;
      top: 50%;
      left: 65%;
    }

    @keyframes pulseStar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.35); }
    }

    /* تلميحات النجوم الخاصة */
    .star-label {
      position: absolute;
      color: rgba(255, 255, 255, 0.85);
      font-size: 15px;
      font-weight: 500;
      pointer-events: none;
      transform: translateY(28px) translateX(-50%);
      white-space: nowrap;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* النافذة المنبثقة (Modal) بتصميم محسن للقراءة المريحة */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 3, 10, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-content {
      background: rgba(30, 20, 50, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 45px 30px;
      width: 90%;
      max-width: 520px;
      text-align: center;
      transform: translateY(30px) scale(0.95);
      transition: transform 0.4s ease;
      position: relative;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0) scale(1);
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 26px;
      color: #cbd5e1;
      cursor: pointer;
      background: none;
      border: none;
      transition: color 0.3s;
    }

    .close-btn:hover {
      color: #fff;
    }

    .modal-icon {
      font-size: 42px;
      margin-bottom: 15px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .modal-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 20px;
      color: #ffb6c1;
    }

    /* تحسين تجربة القراءة: خط مريح، مسافات واسعة، ووضوح تام */
    .modal-text {
      font-size: 19px;
      line-height: 2.1;
      color: #f8fafc;
      font-weight: 300;
      text-align: center;
      max-height: 60vh;
      overflow-y: auto;
      padding: 0 10px;
    }

    .modal-text::-webkit-scrollbar {
      width: 6px;
    }
    .modal-text::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    .modal-text strong {
      color: #fff;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- حاوية السماء المرصعة بالنجوم -->
  <div id="sky"></div>

  <!-- النجمة المخصصة لرسالة الحب -->
  <div class="special-star letter-star" onclick="showLetter()">
    <div class="star-label">✨ رسالة حب</div>
  </div>

  <!-- النجمة المخصصة للشعر -->
  <div class="special-star poem-star" onclick="showPoem()">
    <div class="star-label">📜 شعر في الحب</div>
  </div>

  <!-- النافذة المنبثقة -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div class="modal-icon" id="modalIcon">💖</div>
      <h2 class="modal-title" id="modalTitle">العنوان</h2>
      <div class="modal-text" id="modalText">النص هنا</div>
    </div>
  </div>

  <script>
    // خواطر وعبارات حب عامة ورومانسية للنجوم العادية
    const sweetQuotes = [
      "أنتِ النور الذي يملأ أيامي فرحاً وسعادة يا زوجتي الحبيبة.",
      "وجودكِ بجانبي يجعل كل لحظة في حياتي تشبه الأعياد.",
      "كل نجمة في هذه السماء تهمس باسمكِ وتخبركِ كم أهواكِ.",
      "معكِ عرفت معنى السعادة الحقيقية واستوطن الدفء قلبي.",
      "ابتسامتكِ هي أجمل ما أراه كل يوم، وأنتِ كل مناي في هذه الحياة.",
      "لا أستطيع تخيل أيامي بدونكِ، فأنتِ الروح التي تسري في عروقي.",
      "أحبكِ بكل ما تعنيه الكلمة من حب وعشق وأمان.",
      "أنتِ رفيقة دربي، وملكة قلبي، وكل أماني السعيدة."
    ];

    // رسالة الحب الطويلة والدافئة
    const loveLetter = `
      إلى زوجتي الغالية وتوأم روحي <strong>فرح</strong>،<br><br>
      في كل يوم أعيشه معكِ، أتاكد أن اختياركِ كان أجمل وأعظم أقداري. أنتِ لستِ فقط شريكة حياتي، بل أنتِ الأمان الذي ألوذ إليه من تعب الأيام، والراحة التي تنعش روحي.<br><br>
      أشكر الله دائماً لأنكِ جمعتِ بيني وبينكِ في هذا العالم الواسع. أود أن أعدكِ بأن أبقى الحصن المنيع والسند الداعم لكِ طوال العمر.<br><br>
      <strong>أحبكِ اليوم، وغداً، وإلى الأبد يا كل حياتي.</strong>
    `;

    // محتوى الشعر الرومانسي البديل للأغنية
    const romanticPoem = `
      يا من ملكتِ القلب واحتللتِ الروحهْ<br>
      بكِ تهتدي روحي وتزول الجروحهْ<br><br>
      يا فرحة العمر يا أملي ويا سكني<br>
      بكِ الحياة تحلو وتطيب لي الفسحةْ<br><br>
      لو تطلبين العين ما تغللى عليكِ أبداً<br>
      فأنتِ النبض في صدري وفي كفي الملوحهْ<br><br>
      دمتِ لي حباً أمد الدهر أقر به<br>
      يا أجمل نساء الكون ويا أطهر الطروحهْ
    `;

    const sky = document.getElementById('sky');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const modalIcon = document.getElementById('modalIcon');

    // إنشاء سماء مرصعة بنجوم كثيفة ومتنوعة
    function createStars() {
      const starCount = 140;
      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        
        const size = Math.random() * 2.8 + 0.8;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.top = Math.random() * 100 + 'vh';
        star.style.left = Math.random() * 100 + 'vw';
        
        star.style.animationDuration = (Math.random() * 3 + 1.5) + 's';
        star.style.animationDelay = (Math.random() * 3) + 's';
        
        star.addEventListener('click', () => {
          const randomQuote = sweetQuotes[Math.floor(Math.random() * sweetQuotes.length)];
          openModal("✨ همسة حب", randomQuote, "💫");
        });

        sky.appendChild(star);
      }
    }

    // عرض رسالة الحب
    function showLetter() {
      openModal("إلى زوجتي الحبيبة فرح 💌", loveLetter, "💖");
    }

    // عرض الشعر
    function showPoem() {
      openModal("أبيات شعرية لأجل عيونك 📜", romanticPoem, "✒️");
    }

    // فتح النافذة
    function openModal(title, text, icon) {
      modalTitle.innerHTML = title;
      modalText.innerHTML = text;
      modalIcon.innerHTML = icon;
      modalOverlay.classList.add('active');
    }

    // إغلاق النافذة
    function closeModal() {
      modalOverlay.classList.remove('active');
    }

    // إغلاق النافذة عند الضغط خارجها
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        closeModal();
      }
    });

    // تهيئة النجوم عند تحميل الصفحة
    createStars();
  </script>
</body>
</html>
