<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كل عام وأنتِ زوجتي الحبيبة فرح ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    /* سماء النجوم */
    #sky {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .star {
      position: absolute;
      background-color: #fff;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: twinkle linear infinite;
    }

    .star:hover {
      transform: scale(2);
      box-shadow: 0 0 20px rgba(255, 255, 255, 1);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* النجوم الخاصة */
    .special-star {
      position: absolute;
      border-radius: 50%;
      cursor: pointer;
      z-index: 5;
      animation: pulseStar 2s infinite;
    }

    .letter-star {
      width: 15px;
      height: 15px;
      background-color: #ffd700;
      box-shadow: 0 0 30px #ffd700, 0 0 50px #ffd700;
      top: 30%;
      left: 40%;
    }

    .song-star {
      width: 15px;
      height: 15px;
      background-color: #00e5ff;
      box-shadow: 0 0 30px #00e5ff, 0 0 50px #00e5ff;
      top: 45%;
      left: 65%;
    }

    @keyframes pulseStar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    /* تلميحات النجوم الخاصة */
    .star-label {
      position: absolute;
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      pointer-events: none;
      transform: translateY(25px) translateX(-50%);
      white-space: nowrap;
    }

    /* النافذة المنبثقة (Modal) بتصميم Glassmorphism */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-content {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      border-radius: 20px;
      padding: 40px;
      width: 90%;
      max-width: 500px;
      text-align: center;
      transform: translateY(30px) scale(0.95);
      transition: transform 0.4s ease;
      position: relative;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0) scale(1);
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 24px;
      color: #9ca3af;
      cursor: pointer;
      background: none;
      border: none;
      transition: color 0.3s;
    }

    .close-btn:hover {
      color: #fff;
    }

    .modal-icon {
      font-size: 40px;
      margin-bottom: 15px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .modal-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 15px;
      color: #fecdd3;
    }

    .modal-text {
      font-size: 18px;
      line-height: 1.8;
      color: #e2e8f0;
      font-weight: 300;
    }

    .modal-text strong {
      color: #fff;
      font-weight: 700;
    }

    /* مشغل الأغنية */
    .song-container iframe {
      width: 100%;
      height: 150px;
      border-radius: 12px;
      margin-top: 15px;
      border: none;
    }
  </style>
</head>
<body>

  <!-- حاوية السماء -->
  <div id="sky"></div>

  <!-- النجمة المخصصة لرسالة الحب -->
  <div class="special-star letter-star" onclick="showLetter()">
    <div class="star-label">✨ رسالة حب</div>
  </div>

  <!-- النجمة المخصصة للأغنية -->
  <div class="special-star song-star" onclick="showSong()">
    <div class="star-label">🎵 أغنيتنا</div>
  </div>

  <!-- النافذة المنبثقة -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div class="modal-icon" id="modalIcon">💖</div>
      <h2 class="modal-title" id="modalTitle">العنوان</h2>
      <div class="modal-text" id="modalText">النص هنا</div>
    </div>
  </div>

  <script>
    // العبارات الرومانسية للنجوم العادية
    const sweetQuotes = [
      "أنتِ أجمل تفصيل في تصميم حياتي يا فرح.",
      "أنا كمهندس أبني الجدران والأساسات، لكنكِ أنتِ من يصنع منها وطناً دافئاً.",
      "كل عام وأنتِ النور الذي يضيء مساحات أيامي.",
      "معكِ، كل زاوية فارغة تمتلئ بالحب والتناسق.",
      "أنتِ المخطط الأجمل الذي لا أحتاج لتعديله أبداً.",
      "تناسق ألوان الكون كله لا يعادل جمال ضحكتك.",
      "ابتسامتك هي أجمل ديكور يزين يومي.",
      "كل نجمة في هذه السماء تحمل لكِ أمنية، وكل أمنية هي أنتِ."
    ];

    // رسالة الحب الطويلة (النجمة الذهبية)
    const loveLetter = `
      إلى حبيبتي وزوجتي الغالية <strong>فرح</strong>،<br><br>
      في يوم ميلادك، أقف متأملاً أجمل مشروع في حياتي، وهو "نحن". 
      كمهندس معماري، أستطيع أن أصمم هياكل صلبة ومبانٍ شاهقة، لكنكِ كمهندسة ديكور وفنانة، من يضع فيها الروح، الدفء، ومعنى "البيت".<br><br>
      أنتِ لستِ فقط شريكة حياتي، بل أنتِ الألوان التي تملأ فراغاتي، والضوء الذي ينساب في كل زوايا عمري. 
      كل عام وأنتِ ملكة قلبي، وتفاصيل الجمال في كل أيامي.<br><br>
      <strong>أحبكِ اليوم، وغداً، وإلى الأبد.</strong>
    `;

    // كود الأغنية المحدث بالرابط الجديد
    const songHTML = `
      استمعي إلى هذه الأغنية التي تعزف ألحان حبي لكِ:
      <div class="song-container">
        <iframe src="https://www.youtube.com/embed/FcIVdQZqKrY?autoplay=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
    `;

    const sky = document.getElementById('sky');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const modalIcon = document.getElementById('modalIcon');

    // إنشاء النجوم العشوائية في السماء
    function createStars() {
      const starCount = 100;
      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        
        // أحجام وأماكن عشوائية
        const size = Math.random() * 3 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.top = Math.random() * 100 + 'vh';
        star.style.left = Math.random() * 100 + 'vw';
        
        // سرعة وميض عشوائية
        star.style.animationDuration = (Math.random() * 3 + 1.5) + 's';
        
        // عند الضغط على نجمة عادية
        star.addEventListener('click', () => {
          const randomQuote = sweetQuotes[Math.floor(Math.random() * sweetQuotes.length)];
          openModal("✨ نجمة تهمس لكِ", randomQuote, "💫");
        });

        sky.appendChild(star);
      }
    }

    // عرض رسالة الحب
    function showLetter() {
      openModal("إلى مهندسة قلبي 🏛️🎨", loveLetter, "💌");
    }

    // عرض الأغنية
    function showSong() {
      openModal("ألحان حبنا 🎶", songHTML, "🎧");
    }

    // فتح النافذة
    function openModal(title, text, icon) {
      modalTitle.innerHTML = title;
      modalText.innerHTML = text;
      modalIcon.innerHTML = icon;
      modalOverlay.classList.add('active');
    }

    // إغلاق النافذة
    function closeModal() {
      modalOverlay.classList.remove('active');
      // إيقاف تشغيل الفيديو عند الإغلاق عبر تفريغ المحتوى مؤقتاً
      if(modalText.innerHTML.includes('iframe')) {
        const temp = modalText.innerHTML;
        modalText.innerHTML = '';
        setTimeout(() => modalText.innerHTML = temp, 100);
      }
    }

    // إغلاق النافذة عند الضغط خارجها
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        closeModal();
      }
    });

    // تهيئة النجوم عند تحميل الصفحة
    createStars();
  </script>
</body>
</html>
